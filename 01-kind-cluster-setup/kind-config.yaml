kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: company-lab

nodes:
  - role: control-plane
    image: kindest/node:v1.31.2   (everything needed to run a Kubernetes node )
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.31.2

  - role: worker
    image: kindest/node:v1.31.2
